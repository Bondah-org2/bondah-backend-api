      operationId: api_v1_admin_jobs_update_update
      description: Update an existing job posting.
      parameters:
      - in: path
        name: job_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminJobUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminJobUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminJobUpdateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobUpdate'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleStatusResponse'
