openapi: 3.0.3
info:
  title: Bondah Dating API
  version: 1.0.0
paths:
  /api/v1/admin/applications/:
    get:
      operationId: api_v1_admin_applications_list
      description: Retrieve job applications with optional filters
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminJobApplicationList'
  /api/v1/admin/applications/{application_id}/:
    get:
      operationId: api_v1_admin_applications_retrieve
      description: Retrieve detailed information of a specific job application
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobApplicationDetail'
  /api/v1/admin/applications/{application_id}/status/:
    put:
      operationId: api_v1_admin_applications_status_update
      description: Update the status of a specific job application
      parameters:
      - in: path
        name: application_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateApplicationStatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminUpdateApplicationStatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminUpdateApplicationStatusRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJobApplication'
  /api/v1/admin/debug-auth/:
    get:
      operationId: api_v1_admin_debug_auth_retrieve
