components:
  schemas:
    AddCircleMembers:
      type: object
      properties:
        user_ids:
          type: array
          items:
            type: integer
      required:
      - user_ids
    AddCircleMembersRequest:
      type: object
      properties:
        user_ids:
          type: array
          items:
            type: integer
      required:
      - user_ids
    AddressGeocode:
      type: object
      properties:
        address:
          type: string
          maxLength: 500
      required:
      - address
    AddressGeocodeRequest:
      type: object
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - address
    AdminBondmakerDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        gender:
          type: string
        location:
          type: string
        bio:
          type: string
        bondmaker_bio:
          type: string
        profile_picture:
          type: string
        date_of_birth:
          type: string
          format: date
        relationship_status:
          type: string
        qualification:
          type: string
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        document_type:
          enum:
          - passport
          - national_id
          - drivers_license
          type: string
          description: |-
            * `passport` - Passport (Recommended)
            * `national_id` - National ID Card
            * `drivers_license` - Driver's License
        front_image:
          type: string
        back_image:
          type: string
        selfie:
          type: string
          readOnly: true
        security_questions:
          type: array
          items:
            $ref: '#/components/schemas/SecurityQuestion'
        social_handles:
          type: array
          items:
            $ref: '#/components/schemas/UserSocialHandleCreate'
          readOnly: true
      required:
      - back_image
      - bio
      - bondmaker_bio
      - date_of_birth
      - document_type
      - email
      - front_image
      - gender
      - id
      - location
      - name
      - profile_picture
      - qualification
      - relationship_status
      - security_questions
      - selfie
      - social_handles
      - uploaded_at
      - user
      - username
    AdminBondmakerStats:
      type: object
      properties:
        pending:
          type: integer
        approved:
          type: integer
        rejected:
          type: integer
      required:
      - approved
      - pending
      - rejected
    AdminLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    AdminLoginResponse:
      type: object
      description: Response returned for basic admin login data.
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          type: object
          additionalProperties: {}
      required:
      - access
      - refresh
      - user
    AdminLogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    AdminPermission:
      type: object
      properties:
        can_view_overview:
          type: boolean
          default: true
        can_view_applications:
          type: boolean
          default: false
        can_view_withdrawals:
          type: boolean
          default: false
        can_view_reports:
          type: boolean
          default: false
        can_manage_team:
          type: boolean
          default: false
    AdminPermissionRequest:
      type: object
      properties:
        can_view_overview:
          type: boolean
          default: true
        can_view_applications:
          type: boolean
          default: false
        can_view_withdrawals:
          type: boolean
          default: false
        can_view_reports:
          type: boolean
          default: false
        can_manage_team:
          type: boolean
          default: false
    AppleOAuthRequest:
      type: object
      properties:
        identity_token:
          type: string
          minLength: 1
        authorization_code:
          type: string
          minLength: 1
        user:
          type: object
          additionalProperties: {}
      required:
      - identity_token
    ApproveVisibility:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        status:
          enum:
          - pending
          - approved
          - rejected
          - expired
          type: string
          description: |-
            * `pending` - Pending
            * `approved` - Approved
            * `rejected` - Rejected
            * `expired` - Expired
      required:
      - id
      - owner_id
    ApproveVisibilityRequest:
      type: object
      properties:
        status:
          enum:
          - pending
          - approved
          - rejected
          - expired
          type: string
          description: |-
            * `pending` - Pending
            * `approved` - Approved
            * `rejected` - Rejected
            * `expired` - Expired
    BondCircle:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        bondmaker_name:
          type: string
          readOnly: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bondmaker_name
      - created_at
      - id
      - name
    BondCircleComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
        user:
          type: integer
          readOnly: true
        user_name:
          type: string
          readOnly: true
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - id
      - post
      - user
      - user_name
    BondCircleCommentRequest:
      type: object
      properties:
        post:
          type: integer
        content:
          type: string
          minLength: 1
      required:
      - content
      - post
    BondCirclePost:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        content:
          type: string
        author_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        likes_count:
          type: integer
          readOnly: true
        comments_count:
          type: integer
          readOnly: true
        is_liked:
          type: boolean
          readOnly: true
      required:
      - author_name
      - comments_count
      - content
      - created_at
      - id
      - is_liked
      - likes_count
    BondCirclePostRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required:
      - content
    BondCircleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        description:
          type: string
      required:
      - name
    BondcoinPackage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        bondcoin_amount:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        price_usd:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_popular:
          type: boolean
        is_active:
          type: boolean
      required:
      - bondcoin_amount
      - id
      - name
      - price_usd
    BondmakerAnalytics:
      type: object
      properties:
        period_days:
          type: integer
        matches:
          type: integer
        matches_growth_percentage:
          type: number
          format: double
        live_profiles:
          type: integer
        live_profiles_growth_percentage:
          type: number
          format: double
        net_subscribers:
          type: integer
        net_subscribers_growth_percentage:
          type: number
          format: double
        likes:
          type: integer
        likes_growth_percentage:
          type: number
          format: double
        comments:
          type: integer
        comments_growth_percentage:
          type: number
