openapi: 3.0.3
info:
  title: Bondah Dating API
  version: 1.0.0
paths:
  /api/v1/admin/bondmakers/:
    get:
      operationId: v1_admin_bondmakers_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search by name, email or phone
      - in: query
        name: status
        schema:
          type: string
          enum:
          - all
          - approved
          - pending
          - rejected
        description: Filter by status
      tags:
      - Admin
      security:
      - jwtAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDocumentVerificationListList'
  /api/v1/admin/bondmakers/pending/{id}/:
    get:
