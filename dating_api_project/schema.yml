      properties:
        status:
          type: string
        message:
          type: string
        reset_token:
          type: string
          format: uuid
      required:
      - message
      - reset_token
      - status
    PatchedApproveVisibilityRequest:
      type: object
      properties:
        status:
          enum:
          - pending
          - approved
          - rejected
          - expired
          type: string
          description: |-
            * `pending` - Pending
            * `approved` - Approved
            * `rejected` - Rejected
            * `expired` - Expired
    PatchedBondmakerProfileUpdateRequest:
      type: object
      properties:
        username:
          type: string
          nullable: true
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 100
        bondmaker_bio:
          type: string
          nullable: true
        thought_leadership:
          type: string
          nullable: true
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        gender:
          enum:
          - male
          - female
          - trans_man
          - trans_woman
          - non_binary
          type: string
          description: |-
            * `male` - Male
            * `female` - Female
            * `trans_man` - Trans Man
            * `trans_woman` - Trans Womman
            * `non_binary` - Non Binary
          nullable: true
        date_of_birth:
          type: string
          format: date
          nullable: true
        relationship_status:
          enum:
          - single
          - divorced
          - widowed
          - separated
          - engaged
          - married
          type: string
          description: |-
            * `single` - Single
            * `divorced` - Divorced
            * `widowed` - Widowed
            * `separated` - Separated
            * `engaged` - Engaged
            * `married` - Married
          nullable: true
        education_level:
          enum:
          - high_school
          - undergrad
          - bachelors
          - masters
          - phd
          - other
          type: string
          description: |-
            * `high_school` - High School
            * `undergrad` - Undergraduate
            * `bachelors` - Bachelor's Degree
            * `masters` - Master's Degree
