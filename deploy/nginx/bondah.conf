# Host nginx site for the Bondah API.
# Copy to /etc/nginx/sites-available/bondah, symlink into sites-enabled,
# replace api.bondah.org with your domain, then run:
#   sudo certbot --nginx -d api.bondah.org
# certbot adds the 443/TLS server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    server_name api.bondah.org;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
